<div class="login-wrapper">
  <mat-card class="login-card">
    
    <mat-card-header>
      <mat-card-title>Logowanie do systemu</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Adres e-mail</mat-label>
          <input matInput type="email" placeholder="jan@kowalski.pl">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Hasło</mat-label>
          <input matInput type="password" placeholder="Wpisz hasło">
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width login-btn">
          Zaloguj się
        </button>
      </form>
    </mat-card-content>

  </mat-card>
</div>
