<div class="login-wrapper">
  <mat-card class="login-card">
    
    <mat-card-header>
      <mat-card-title>Logowanie do systemu</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Adres e-mail</mat-label>
          <input matInput type="email" formControlName="email" placeholder="jan@kowalski.pl">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Hasło</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Wpisz hasło">
        </mat-form-field>

        @if (serverError()) {
          <div style="color: #f44336; font-size: 12px; margin-bottom: 16px; padding-left: 4px;">
            <mat-icon style="vertical-align: middle; font-size: 16px; width: 16px; height: 16px;">error_outline</mat-icon>
            {{ serverError() }}
          </div>
        }
        <button mat-flat-button color="primary" class="full-width login-btn" type="submit" [disabled]="loginForm.invalid">
          Zaloguj się
        </button>

      </form>
    </mat-card-content>

  </mat-card>
</div>
