<h2 mat-dialog-title>Potwierdzenie usunięcia</h2>

<mat-dialog-content>
  <p>Czy na pewno chcesz usunąć ankietę: <strong>{{ data.title }}</strong>?</p>
  <p style="color: #f44336; font-size: 12px; margin-top: 8px;">Tej operacji nie będzie można cofnąć.</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Anuluj</button>
  
  <button mat-flat-button color="warn" [mat-dialog-close]="true">Usuń na zawsze</button>
</mat-dialog-actions>
