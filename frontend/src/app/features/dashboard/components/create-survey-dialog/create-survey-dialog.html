<h2 mat-dialog-title>Utwórz nową ankietę</h2>

<mat-dialog-content>
  <p>Podaj nazwę dla swojej nowej ankiety:</p>
  
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Tytuł ankiety</mat-label>
    <input matInput [formControl]="titleControl" placeholder="np. Badanie zadowolenia klientów" (keyup.enter)="onSave()">
    @if (titleControl.hasError('required') || titleControl.hasError('whitespace')) {
      <mat-error>Prawidłowy tytuł jest wymagany</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Anuluj</button>
  <button mat-flat-button color="primary" [disabled]="titleControl.invalid" (click)="onSave()">
    Utwórz
  </button>
</mat-dialog-actions>
