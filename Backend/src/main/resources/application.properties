# ===== Serwer =====
server.port=8080
spring.application.name=SystemAnkiet

# ===== Baza danych - Microsoft SQL Server =====
# Zmien ponizsze dane na swoje ustawienia polaczenia z SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SystemAnkiet;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TwojHasloDoSQL
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# update = automatycznie tworzy/aktualizuje tabele na podstawie encji
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
# Klucz musi miec min. 32 znaki (256 bitow dla HMAC-SHA256)
# ZMIEN TEN KLUCZ NA PRODUKCJI!
jwt.secret=SystemAnkietSekretnyKluczJWT2026BNABDxxx
jwt.expiration=86400000

# ===== Logowanie =====
logging.level.com.systemankiet=INFO
